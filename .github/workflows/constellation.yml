name: Generate Constellation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Create folders
        run: mkdir -p dist scripts

      - name: Create Constellation Script
        run: |
          cat << 'EOF' > scripts/constellation.py
          import requests
          import os
          import math

          USERNAME = "anuraaggg"
          TOKEN = os.environ["GITHUB_TOKEN"]

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  weeks {
                    contributionDays {
                      contributionCount
                      date
                      weekday
                    }
                  }
                }
              }
            }
          }
          """

          headers = {"Authorization": f"Bearer {TOKEN}"}

          response = requests.post(
              "https://api.github.com/graphql",
              json={"query": query, "variables": {"login": USERNAME}},
              headers=headers
          )
          data = response.json()
          weeks = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]

          cell_size = 14
          width = len(weeks) * cell_size + 60
          height = 7 * cell_size + 60

          stars = []
          for week_index, week in enumerate(weeks):
              for day in week["contributionDays"]:
                  count = day["contributionCount"]
                  x = week_index * cell_size + 30
                  y = day["weekday"] * cell_size + 30
                  stars.append((x, y, count))

          svg = f'''<svg width="{width}" height="{height}" xmlns="http://www.w3.org/2000/svg">
          <rect width="100%" height="100%" fill="#0d1117"/>
          <defs>
            <filter id="glow">
              <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
              <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>'''

          # Draw constellation lines between nearby active stars
          active_stars = [(x, y, c) for x, y, c in stars if c > 0]
          drawn_lines = set()
          for i, (x1, y1, c1) in enumerate(active_stars):
              for j, (x2, y2, c2) in enumerate(active_stars):
                  if i >= j:
                      continue
                  dist = math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2)
                  if dist < cell_size * 2.2:
                      key = (min(i,j), max(i,j))
                      if key not in drawn_lines:
                          drawn_lines.add(key)
                          svg += f'<line x1="{x1}" y1="{y1}" x2="{x2}" y2="{y2}" stroke="white" stroke-width="0.4" opacity="0.15"/>'

          # Draw all dots (faint grid)
          for x, y, count in stars:
              svg += f'<circle cx="{x}" cy="{y}" r="1.5" fill="white" opacity="0.05"/>'

          # Draw active stars with glow + pulse
          for x, y, count in stars:
              if count > 0:
                  opacity = round(min(1.0, 0.35 + count * 0.1), 2)
                  low = round(opacity * 0.5, 2)
                  radius = round(min(4.5, 2.5 + count * 0.3), 2)
                  dur = round(2.5 + (hash((x, y)) % 20) * 0.15, 2)
                  svg += f'''<circle cx="{x}" cy="{y}" r="{radius}" fill="white" opacity="{opacity}" filter="url(#glow)">
                    <animate attributeName="opacity"
                             values="{low};{opacity};{low}"
                             dur="{dur}s"
                             repeatCount="indefinite"/>
                  </circle>'''

          svg += "</svg>"

          with open("dist/constellation.svg", "w") as f:
              f.write(svg)

          print(f"Done! {len(active_stars)} active stars, {len(drawn_lines)} constellation lines.")
          EOF

      - name: Run script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/constellation.py

      - name: Commit and push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git checkout -B output
          git add dist/constellation.svg
          git commit -m "Update constellation [skip ci]" || echo "No changes to commit"
          git push origin output --force
