name: Generate Constellation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Create folders
        run: mkdir -p dist scripts

      - name: Create Constellation Script
        run: |
          cat << 'EOF' > scripts/constellation.py
          import requests
          import re

          USERNAME = "anuraaggg"

          url = f"https://github.com/users/{USERNAME}/contributions"
          response = requests.get(url)
          svg_data = response.text

          rects = re.findall(r'<rect[^>]*data-count="(\d+)"[^>]*x="([\d.]+)"[^>]*y="([\d.]+)"', svg_data)

          width = 900
          height = 200

          stars = []

          for count, x, y in rects:
              count = int(count)
              if count > 0:
                  stars.append((float(x), float(y), count))

          scale_x = 12
          scale_y = 12

          final_svg = f'''<svg width="{width}" height="{height}" xmlns="http://www.w3.org/2000/svg">
          <rect width="100%" height="100%" fill="black"/>'''

          for x, y, count in stars:
              cx = x * scale_x
              cy = y * scale_y

              opacity_base = min(1, 0.3 + count * 0.1)

              final_svg += f'''
              <circle cx="{cx}" cy="{cy}" r="2" fill="white" opacity="{opacity_base}">
                  <animate attributeName="opacity"
                           values="{opacity_base * 0.5};{opacity_base};{opacity_base * 0.5}"
                           dur="4s"
                           repeatCount="indefinite"/>
              </circle>'''

          final_svg += "\n</svg>"

          with open("dist/constellation.svg", "w") as f:
              f.write(final_svg)
          EOF

      - name: Run script
        run: python scripts/constellation.py

      - name: Commit and push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git checkout -B output
          git add dist/constellation.svg
          git commit -m "Update constellation"
          git push origin output --force
