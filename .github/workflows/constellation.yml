name: Generate Constellation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Create folders
        run: mkdir -p dist scripts

      - name: Create Constellation Script
        run: |
          cat << 'EOF' > scripts/constellation.py
          import requests
          import re

          USERNAME = "anuraaggg"

          url = f"https://github.com/users/{USERNAME}/contributions"
          response = requests.get(url)
          svg_data = response.text

          rects = re.findall(
              r'<rect[^>]*data-count="(\d+)"[^>]*x="([\d.]+)"[^>]*y="([\d.]+)"',
              svg_data
          )

          width = 900
          height = 220

          final_svg = f'''<svg width="{width}" height="{height}" xmlns="http://www.w3.org/2000/svg">
          <rect width="100%" height="100%" fill="black"/>'''

          # Draw faint grid (all days)
          for count, x, y in rects:
              cx = float(x) + 15
              cy = float(y) + 15

              final_svg += f'''
              <circle cx="{cx}" cy="{cy}" r="2" fill="white" opacity="0.05"/>'''

          # Draw bright animated stars for real contributions
          for count, x, y in rects:
              count = int(count)
              if count > 0:
                  cx = float(x) + 15
                  cy = float(y) + 15

                  opacity_base = min(1, 0.4 + count * 0.08)

                  final_svg += f'''
                  <circle cx="{cx}" cy="{cy}" r="3" fill="white" opacity="{opacity_base}">
                      <animate attributeName="opacity"
                               values="{opacity_base * 0.6};{opacity_base};{opacity_base * 0.6}"
                               dur="3s"
                               repeatCount="indefinite"/>
                  </circle>'''

          final_svg += "\n</svg>"

          with open("dist/constellation.svg", "w") as f:
              f.write(final_svg)
          EOF

      - name: Run script
        run: python scripts/constellation.py

      - name: Commit and push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git checkout -B output
          git add dist/constellation.svg
          git commit -m "Update constellation"
          git push origin output --force
