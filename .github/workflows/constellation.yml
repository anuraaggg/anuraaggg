name: Generate Constellation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Create folders
        run: mkdir -p dist scripts

      - name: Create Constellation Script
        run: |
          cat << 'EOF' > scripts/constellation.py
          import requests
          import os
          import math
          import random

          USERNAME = "anuraaggg"
          TOKEN = os.environ["GITHUB_TOKEN"]

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  weeks {
                    contributionDays {
                      contributionCount
                      date
                    }
                  }
                }
              }
            }
          }
          """

          headers = {"Authorization": f"Bearer {TOKEN}"}
          response = requests.post(
              "https://api.github.com/graphql",
              json={"query": query, "variables": {"login": USERNAME}},
              headers=headers
          )
          data = response.json()
          weeks = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]

          days = []
          for week in weeks:
              for day in week["contributionDays"]:
                  days.append(day)

          WIDTH = 900
          HEIGHT = 400
          PADDING = 40

          random.seed(42)

          active_days = [d for d in days if d["contributionCount"] > 0]
          inactive_days = [d for d in days if d["contributionCount"] == 0]

          def seeded_pos(seed_str, padding=PADDING):
              r = random.Random(seed_str)
              x = r.uniform(padding, WIDTH - padding)
              y = r.uniform(padding, HEIGHT - padding)
              return x, y

          stars = []
          for day in active_days:
              x, y = seeded_pos(day["date"])
              count = day["contributionCount"]
              stars.append((x, y, count, day["date"]))

          bg_stars = []
          sample = random.sample(inactive_days, min(60, len(inactive_days)))
          for day in sample:
              x, y = seeded_pos(day["date"] + "_bg")
              bg_stars.append((x, y))

          CONNECT_DIST = 80
          lines = []
          for i, (x1, y1, c1, d1) in enumerate(stars):
              neighbors = []
              for j, (x2, y2, c2, d2) in enumerate(stars):
                  if i >= j:
                      continue
                  dist = math.sqrt((x2 - x1)**2 + (y2 - y1)**2)
                  if dist < CONNECT_DIST:
                      neighbors.append((dist, j))
              neighbors.sort()
              for _, j in neighbors[:2]:
                  lines.append((i, j))

          svg = f'''<svg width="{WIDTH}" height="{HEIGHT}" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="bggrad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" style="stop-color:#0d1b2a;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#010408;stop-opacity:1" />
            </radialGradient>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
              <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <rect width="100%" height="100%" fill="url(#bggrad)"/>
          '''

          for x, y in bg_stars:
              r = random.Random(f"{x}{y}")
              op = round(r.uniform(0.08, 0.25), 2)
              radius = round(r.uniform(0.5, 1.2), 2)
              svg += f'<circle cx="{x:.1f}" cy="{y:.1f}" r="{radius}" fill="white" opacity="{op}"/>\n'

          for i, j in lines:
              x1, y1, c1, _ = stars[i]
              x2, y2, c2, _ = stars[j]
              svg += f'<line x1="{x1:.1f}" y1="{y1:.1f}" x2="{x2:.1f}" y2="{y2:.1f}" stroke="#4a9eff" stroke-width="0.6" opacity="0.25"/>\n'

          for x, y, count, date in stars:
              radius = round(min(5.5, 1.8 + count * 0.4), 2)
              opacity = round(min(1.0, 0.5 + count * 0.08), 2)
              low_op = round(opacity * 0.45, 2)
              dur = round(2.0 + random.Random(date).uniform(0, 2.5), 2)
              if count >= 8:
                  color = "#ffffff"
              elif count >= 4:
                  color = "#cce8ff"
              elif count >= 2:
                  color = "#99ccff"
              else:
                  color = "#6699cc"

              svg += f'''<circle cx="{x:.1f}" cy="{y:.1f}" r="{radius}" fill="{color}" opacity="{opacity}" filter="url(#glow)">
                <animate attributeName="opacity" values="{low_op};{opacity};{low_op}" dur="{dur}s" repeatCount="indefinite"/>
              </circle>\n'''

          svg += "</svg>"

          with open("dist/constellation.svg", "w") as f:
              f.write(svg)

          print(f"Generated: {len(stars)} active stars, {len(bg_stars)} background stars, {len(lines)} lines.")
          EOF

      - name: Run script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/constellation.py

      - name: Commit and push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          cp dist/constellation.svg /tmp/constellation.svg

          git fetch origin
          git checkout -B output origin/output 2>/dev/null || git checkout -B output

          mkdir -p dist
          cp /tmp/constellation.svg dist/constellation.svg

          git add dist/constellation.svg
          git status
          git commit -m "Update constellation [skip ci]" || echo "No changes to commit"
          git push origin output --force
```

Replace your existing file with this, then run the workflow again. The SVG will be at:
```
https://raw.githubusercontent.com/anuraaggg/anuraaggg/output/dist/constellation.svg
