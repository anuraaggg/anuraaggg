name: Generate Constellation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Create folders
        run: mkdir -p dist scripts

      - name: Create Constellation Script
        run: |
          cat << 'EOF' > scripts/constellation.py
          import random

          width = 900
          height = 250
          stars = []

          for i in range(200):
              x = random.randint(0, width)
              y = random.randint(0, height)
              delay = random.uniform(0, 3)
              stars.append((x, y, delay))

          svg = f'''<svg width="{width}" height="{height}" xmlns="http://www.w3.org/2000/svg">
          <rect width="100%" height="100%" fill="black"/>'''

          for x, y, delay in stars:
              svg += f'''
              <circle cx="{x}" cy="{y}" r="1.5" fill="white">
                  <animate attributeName="opacity"
                           values="0.2;1;0.2"
                           dur="3s"
                           begin="{delay}s"
                           repeatCount="indefinite"/>
              </circle>'''

          svg += "\n</svg>"

          with open("dist/constellation.svg", "w") as f:
              f.write(svg)
          EOF

      - name: Run script
        run: python scripts/constellation.py

      - name: Commit and push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git checkout -B output
          git add dist/constellation.svg
          git commit -m "Update constellation"
          git push origin output --force
